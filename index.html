<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling System Dashboard</title>
    <style>
        :root {
            /* Solo Leveling Theme Colors */
            --bg-color: #080a10; 
            --card-bg: #11151e;
            --accent-green: #00e5ff; /* Geändert zu System-Blau für den XP Balken! */
            --accent-gold: #ffc107;
            --accent-purple: #9b59b6;
            --accent-red: #ff3366;
            --accent-blue: #00e5ff; 
            --text-main: #e0e6ed;
            --text-muted: #6b7c93;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 800px; width: 100%; }
        .coin-balance, .coin-text { filter: sepia(1) saturate(5) hue-rotate(-30deg); }

        /* HEADER & PROFIL */
        .header-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; gap: 20px; }
        .profile-card { flex-grow: 1; background: var(--card-bg); border-radius: 15px; padding: 20px; border: 1px solid #1c2433; box-shadow: 0 10px 30px rgba(0,229,255,0.1); }
        .shop-btn-large { background: linear-gradient(45deg, #2b3240, #11151e); color: var(--accent-blue); font-size: 1.2rem; font-weight: bold; border: 1px solid var(--accent-blue); border-radius: 15px; padding: 20px 30px; cursor: pointer; display: flex; flex-direction: column; align-items: center; box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); transition: transform 0.2s, box-shadow 0.2s; }
        .shop-btn-large:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0, 229, 255, 0.5); background: linear-gradient(45deg, #11151e, #1a2233); }
        
        .profile-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .level-badge { font-size: 1.4rem; font-weight: bold; background: linear-gradient(45deg, #00e5ff, #0077ff); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .coin-balance { font-size: 1.4rem; font-weight: bold; color: var(--accent-gold); }
        .xp-bar-container { width: 100%; height: 12px; background: #1c2433; border-radius: 10px; overflow: hidden; margin-top: 5px; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }
        .xp-bar-fill { height: 100%; background: var(--accent-green); width: 0%; transition: width 0.5s ease-in-out; box-shadow: 0 0 10px var(--accent-green); }
        
        /* ACTIVE TIMERS */
        #active-timers-container { margin-bottom: 20px; }
        .timer-bar { background: var(--accent-blue); color: #000; padding: 10px 20px; border-radius: 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; box-shadow: 0 0 15px var(--accent-blue); animation: pulse 2s infinite; margin-bottom: 10px;}
        @keyframes pulse { 0% { box-shadow: 0 0 10px rgba(0,229,255,0.5); } 50% { box-shadow: 0 0 20px rgba(0,229,255,1); } 100% { box-shadow: 0 0 10px rgba(0,229,255,0.5); } }

        /* TABS */
        .tabs { display: flex; gap: 10px; border-bottom: 2px solid #1c2433; margin-bottom: 20px; }
        .tab-btn { background: transparent; color: var(--text-muted); border: none; padding: 10px 20px; font-size: 1.1rem; cursor: pointer; font-weight: bold; border-bottom: 3px solid transparent; transition: 0.3s;}
        .tab-btn.active { color: var(--accent-blue); border-bottom: 3px solid var(--accent-blue); text-shadow: 0 0 10px rgba(0,229,255,0.5); }
        
        /* CARDS (Quests & Shop) */
        .grid { display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 18px; border: 1px solid #1c2433; transition: 0.3s; }
        .card:hover { border-color: var(--accent-blue); box-shadow: 0 0 15px rgba(0,229,255,0.1); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
        .card-title { margin: 0; font-size: 1.1rem; color: #fff; }
        .deadline { font-size: 0.8rem; color: var(--accent-red); font-weight: bold; margin-bottom: 12px; display: inline-block; background: rgba(255,51,102,0.1); padding: 3px 8px; border-radius: 5px;}
        .type-tag { font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; background: rgba(155,89,182,0.1); color: var(--accent-purple); font-weight: bold; border: 1px solid rgba(155,89,182,0.3); }
        
        .completion-bonus { font-size: 0.85rem; color: var(--text-main); background: rgba(0,229,255,0.05); padding: 8px; border-radius: 6px; border: 1px dashed var(--accent-blue); margin-top: 10px; }
        
        /* STEPS */
        .steps-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        .step-item { display: flex; justify-content: space-between; align-items: center; background: #0c1017; padding: 10px; border-radius: 8px; border: 1px solid #1c2433; }
        .rewards-info { font-size: 0.85rem; display: flex; gap: 12px; }
        .xp-text { color: var(--accent-green); font-weight: bold; }
        .coin-text { color: var(--accent-gold); font-weight: bold; }

        /* BUTTONS */
        button.action-btn { background: #1c2433; color: var(--text-main); border: 1px solid #2b3240; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button.action-btn:hover:not(:disabled) { background: var(--accent-blue); color: #000; box-shadow: 0 0 10px var(--accent-blue); border-color: var(--accent-blue); }
        button.accept-btn { background: rgba(0, 229, 255, 0.1); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
        button.accept-btn:hover { background: var(--accent-blue); color: #000; }
        button.buy-btn { background: rgba(255, 193, 7, 0.1); color: var(--accent-gold); border: 1px solid var(--accent-gold); }
        button.buy-btn:hover { background: var(--accent-gold); color: black; box-shadow: 0 0 10px var(--accent-gold); }
        button:disabled { background: #0c1017; color: #444; cursor: not-allowed; border: 1px solid #111; }

        /* SHOP MODAL (Overlay) */
        #shop-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-color); width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; border-radius: 15px; border: 2px solid var(--accent-blue); padding: 25px; box-shadow: 0 0 30px rgba(0,229,255,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1c2433; padding-bottom: 15px; margin-bottom: 20px; }
        .close-btn { background: transparent; color: white; font-size: 1.5rem; border: none; cursor: pointer; transition: 0.2s; }
        .close-btn:hover { color: var(--accent-red); transform: scale(1.1); }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Aktive Timer -->
    <div id="active-timers-container"></div>

    <!-- Header (Profil + Shop Button) -->
    <div class="header-bar">
        <div class="profile-card">
            <div class="profile-header">
                <div class="level-badge" id="level-text">Level --</div>
                <div class="coin-balance" id="coin-text">🪙 --</div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-muted);">
                <span>System-XP</span>
                <span id="xp-text">-- / --</span>
            </div>
            <div class="xp-bar-container">
                <div class="xp-bar-fill" id="xp-bar"></div>
            </div>
        </div>
        <button class="shop-btn-large" onclick="openShop()">
            <span style="font-size: 1.8rem; margin-bottom: 5px;">🛒</span>
            System-Shop
        </button>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active" id="tab-active" onclick="switchTab('active')">⚔️ Aktive Quests</button>
        <button class="tab-btn" id="tab-available" onclick="switchTab('available')">📜 Quest-Tafel</button>
    </div>

    <div class="grid" id="quests-container"></div>

</div>

<!-- SHOP MODAL -->
<div id="shop-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 style="margin:0; color: var(--accent-blue);">🌌 System-Belohnungen</h2>
            <button class="close-btn" onclick="closeShop()">✖</button>
        </div>
        <div class="grid" id="shop-container"></div>
    </div>
</div>

<script>
    const API_URL = "https://habithero-api.onrender.com"; // Ändere dies zu http://localhost:8000 wenn du lokal testest
    let currentTab = 'active';

    // Timer Logik
    let activeTimers = [];

    async function loadData() {
        await loadUser();
        await loadQuests();
    }

    async function loadUser() {
        const res = await fetch(`${API_URL}/user`);
        const user = await res.json();
        document.getElementById('level-text').innerText = `Level ${user.level}`;
        document.getElementById('coin-text').innerText = `🪙 ${user.coin_balance}`;
        document.getElementById('xp-text').innerText = `${user.current_xp} / ${user.xp_to_next_level}`;
        document.getElementById('xp-bar').style.width = `${(user.current_xp / user.xp_to_next_level) * 100}%`;
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab-active').classList.toggle('active', tab === 'active');
        document.getElementById('tab-available').classList.toggle('active', tab === 'available');
        loadQuests();
    }

    async function loadQuests() {
        const res = await fetch(`${API_URL}/habits`);
        const allQuests = await res.json();
        const container = document.getElementById('quests-container');
        container.innerHTML = '';

        for (const [id, data] of Object.entries(allQuests)) {
            if (data.status !== currentTab) continue; 

            const card = document.createElement('div');
            card.className = 'card';

            let bodyHtml = '';
            
            if (currentTab === 'available') {
                bodyHtml = `<div style="text-align: right; margin-top: 15px;"><button class="action-btn accept-btn" onclick="acceptQuest('${id}')">Quest annehmen</button></div>`;
            } 
            else {
                if (data.has_steps) {
                    bodyHtml += `<div class="steps-list">`;
                    data.steps.forEach((step, idx) => {
                        const btn = step.is_completed 
                            ? `<button class="action-btn" disabled>Erledigt ✓</button>`
                            : `<button class="action-btn" onclick="completeStep('${id}', ${idx})">Abschließen</button>`;
                        bodyHtml += `<div class="step-item">
                            <div><strong>${step.name}</strong><br><span style="font-size:0.75rem; color:var(--text-muted)">⚡ +${step.xp_reward} XP | 🪙 +${step.coin_reward}</span></div>
                            ${btn}
                        </div>`;
                    });
                    bodyHtml += `</div>`;
                    bodyHtml += `<div class="completion-bonus">🎁 <strong>Quest-Abschluss Bonus:</strong> +${data.bonus_xp} XP & +${data.bonus_coins} 🪙</div>`;
                } else {
                    bodyHtml = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px; border-top:1px solid #1c2433; padding-top:10px;">
                        <div class="rewards-info">
                            ${data.xp_reward > 0 ? `<span class="xp-text">⚡ +${data.xp_reward} XP</span>` : ''}
                            ${data.coin_reward > 0 ? `<span class="coin-text">🪙 +${data.coin_reward}</span>` : ''}
                        </div>
                        <button class="action-btn" onclick="completeQuest('${id}')">Quest Abschließen</button>
                    </div>`;
                }
            }

            card.innerHTML = `
                <div class="card-header">
                    <h3 class="card-title">${data.title}</h3>
                    <span class="type-tag">${data.type}</span>
                </div>
                <div class="deadline">⏳ Deadline: ${data.deadline}</div>
                ${bodyHtml}
            `;
            container.appendChild(card);
        }
        
        if(container.innerHTML === '') {
            container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted);">Keine Quests in dieser Kategorie vorhanden, Jäger.</div>`;
        }
    }

    async function openShop() {
        document.getElementById('shop-modal').style.display = 'flex';
        const res = await fetch(`${API_URL}/shop`);
        const shop = await res.json();
        const container = document.getElementById('shop-container');
        container.innerHTML = '';

        for (const [id, item] of Object.entries(shop)) {
            const timerInfo = item.duration_minutes > 0 ? `<div style="color:var(--accent-blue); font-size:0.85rem; margin-bottom:10px; font-weight:bold;">⏱️ Aktiviert Instanz-Timer: ${item.duration_minutes} Min.</div>` : '';
            container.innerHTML += `
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">${item.title}</h3>
                        <span class="coin-balance" style="font-size:1.1rem;">🪙 ${item.cost}</span>
                    </div>
                    <p style="color: var(--text-muted); font-size: 0.9rem; margin: 5px 0 10px 0;">${item.description}</p>
                    ${timerInfo}
                    <div style="text-align: right;">
                        <button class="action-btn buy-btn" onclick="buyItem('${id}')">Kaufen & Aktivieren</button>
                    </div>
                </div>`;
        }
    }

    function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }

    async function acceptQuest(id) {
        await fetch(`${API_URL}/habits/${id}/accept`, { method: 'POST' });
        loadData();
    }

    async function completeQuest(id) {
        const res = await fetch(`${API_URL}/habits/${id}/complete`, { method: 'POST' });
        const result = await res.json();
        if(result.leveled_up) alert("⚡ SYSTEM MELDUNG: LEVEL UP! Deine Werte haben sich erhöht.");
        loadData();
    }

    async function completeStep(id, idx) {
        const res = await fetch(`${API_URL}/habits/${id}/step/${idx}/complete`, { method: 'POST' });
        const result = await res.json();
        if(result.leveled_up) alert("⚡ SYSTEM MELDUNG: LEVEL UP! Deine Werte haben sich erhöht.");
        if(result.message.includes("Komplettierungs-Bonus")) alert(result.message);
        loadData();
    }

    async function buyItem(id) {
        const res = await fetch(`${API_URL}/shop/${id}/buy`, { method: 'POST' });
        const result = await res.json();
        if (res.ok) {
            alert(`🛒 System: ${result.message}`);
            closeShop();
            loadUser();
            
            if (result.duration_minutes > 0) {
                startTimer(result.duration_minutes * 60, result.item_name || "Instanz Aktiv");
            }
        } else {
            alert(`Warnung: ${result.detail}`);
        }
    }

    function startTimer(secondsLeft, title) {
        activeTimers.push({ title: title, remaining: secondsLeft });
        renderTimers();
    }

    function renderTimers() {
        const container = document.getElementById('active-timers-container');
        container.innerHTML = '';
        activeTimers.forEach(timer => {
            const minutes = Math.floor(timer.remaining / 60);
            const seconds = timer.remaining % 60;
            const timeStr = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            
            container.innerHTML += `
                <div class="timer-bar">
                    <span>🌌 Dungeon-Instanz geöffnet</span>
                    <span>${timeStr}</span>
                </div>
            `;
        });
    }

    setInterval(() => {
        if (activeTimers.length > 0) {
            activeTimers = activeTimers.filter(t => t.remaining > 0);
            activeTimers.forEach(t => t.remaining--);
            renderTimers();
        }
    }, 1000);

    window.onload = loadData;
</script>

</body>
</html>
